name: Deploy backend to Fly.io

# Manual only: Actions -> "Deploy backend to Fly.io" -> Run workflow.
# GitHub needs one secret: FLY_API_TOKEN (deploy token for the blue-collar-appz org).
# App secrets (JWT_SECRET, STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET, CORS_ORIGINS) live on Fly
# only: `fly secrets set --app bca-foodtruck-apollo-api ...`. This workflow checks that they
# exist (names only) and never reads or prints their values.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-backend
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: bca-foodtruck-apollo-api
      ORG: blue-collar-appz
      REGION: iad
      VOLUME: apollo_data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check FLY_API_TOKEN is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the repository secret FLY_API_TOKEN."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.119

      - name: Validate fly.toml
        working-directory: backend
        run: flyctl config validate --config fly.toml --app "$APP"

      - name: Create the app if it does not exist
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App $APP exists."
          else
            flyctl apps create "$APP" --org "$ORG"
          fi

      - name: Create the data volume if it does not exist
        run: |
          count=$(flyctl volumes list --app "$APP" --json | python3 -c "import json,sys,os; print(sum(1 for v in json.load(sys.stdin) if v.get('name')==os.environ['VOLUME']))")
          if [ "$count" -eq 0 ]; then
            flyctl volumes create "$VOLUME" --app "$APP" --region "$REGION" --size 1 --yes
          elif [ "$count" -gt 1 ]; then
            echo "::error::Found $count volumes named $VOLUME. SQLite needs exactly one machine and one volume; remove the extras in the Fly dashboard."
            exit 1
          else
            echo "Volume $VOLUME exists."
          fi

      - name: Refuse to deploy onto more than one machine
        run: |
          count=$(flyctl machines list --app "$APP" --json | python3 -c "import json,sys; print(len(json.load(sys.stdin) or []))")
          echo "Existing machines: $count"
          if [ "$count" -gt 1 ]; then
            echo "::error::App $APP has $count machines. SQLite needs exactly one. Run 'fly scale count 1 --app $APP' (or remove extras in the Fly dashboard), then re-run."
            exit 1
          fi

      - name: Check required secrets exist on Fly (names only)
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          required = ["JWT_SECRET", "STRIPE_API_KEY", "STRIPE_WEBHOOK_SECRET", "CORS_ORIGINS"]
          out = subprocess.run(["flyctl", "secrets", "list", "--app", os.environ["APP"], "--json"],
                               capture_output=True, text=True, check=True).stdout
          have = {s.get("name") or s.get("Name") for s in json.loads(out or "[]")}
          missing = [k for k in required if k not in have]
          if missing:
              print("::error::Missing Fly secrets: " + ", ".join(missing) +
                    ". Set them with: fly secrets set --app " + os.environ["APP"] + " NAME=value ...")
              sys.exit(1)
          print("Required secrets are present.")
          PY

      - name: Deploy (one machine)
        working-directory: backend
        run: flyctl deploy --config fly.toml --app "$APP" --remote-only --ha=false --wait-timeout 5m

      - name: Verify the live backend
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = f"https://{os.environ['APP']}.fly.dev"
          body, status = b"", 0
          for attempt in range(12):  # first request may wake a stopped machine
              try:
                  with urllib.request.urlopen(base + "/api/", timeout=20) as r:
                      status, body = r.status, r.read()
                  if status == 200:
                      break
              except Exception as exc:
                  print("waiting:", exc)
              time.sleep(5)
          payload = json.loads(body or "{}")
          print("GET /api/ ->", status, payload)
          assert status == 200 and payload.get("status") == "healthy", payload
          print(f"Backend OK at {base}")
          PY

      - name: Machine and volume status
        if: always()
        run: |
          flyctl status --app "$APP" || true
          flyctl volumes list --app "$APP" || true
